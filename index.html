<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071d18">
  <title>Desafío Mecánico INCCA</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#effff7;background:#061813;--lime:#d6f331;--green:#20ca86;--panel:#0d2b23;--line:#2b5d4e;--muted:#a7c4b8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 82% 8%,#17503a 0,transparent 29%),linear-gradient(145deg,#05140f,#09251e);color:#effff7}button,input{font:inherit}button{cursor:pointer}.shell{width:min(100%,1050px);margin:auto;padding:0 16px 35px}.top{min-height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff16;gap:14px}.brand{display:flex;gap:11px;align-items:center;font-weight:900;letter-spacing:.04em}.mark{width:44px;height:44px;border:2px solid var(--lime);color:var(--lime);display:grid;place-items:center;clip-path:polygon(25% 0,75% 0,100% 25%,100% 75%,75% 100%,25% 100%,0 75%,0 25%);font-size:25px}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.14em;margin-top:3px}.top-actions{display:flex;gap:8px}.icon{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:#0b2b22;color:#fff}.panel{margin:34px 0;background:#0b2922ed;border:1px solid #2c5b4e;border-radius:20px;padding:clamp(20px,4vw,42px);box-shadow:0 25px 90px #0005}.eyebrow{margin:0 0 12px;color:var(--lime);font-size:11px;font-weight:850;letter-spacing:.17em;text-transform:uppercase}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:50px;align-items:center}.hero h1,.finish h1{font-size:clamp(42px,7vw,76px);line-height:.97;margin:0 0 20px;letter-spacing:-.045em}.hero h1 span,.finish h1 span{color:var(--lime)}.lead{color:#c5ddd3;line-height:1.6;font-size:18px}.stats{display:flex;margin:25px 0}.stats div{padding:0 25px;border-left:1px solid var(--line);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em}.stats div:first-child{padding-left:0;border:0}.stats b{display:block;color:#fff;font-size:24px}.field{display:block;font-size:13px;font-weight:800}.field input{display:block;width:100%;max-width:500px;margin:8px 0;background:#071d18;border:1px solid #477565;border-radius:10px;padding:15px;color:#fff;outline:none}.field input:focus{border-color:var(--lime);box-shadow:0 0 0 3px #d6f33120}.field small{display:block;color:#7fa394;font-weight:400}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.btn{border:0;border-radius:10px;padding:14px 20px;min-height:50px;font-weight:850;background:var(--lime);color:#132019}.btn.secondary{background:#173c31;color:#fff;border:1px solid #487668}.btn:disabled{opacity:.42;cursor:not-allowed}.machine{min-height:350px;display:grid;place-items:center;position:relative}.gear{position:absolute;font-size:220px;color:#20cc8666;animation:spin 16s linear infinite;text-shadow:0 0 60px #23d98d55}.gear.two{font-size:120px;color:#d6f33166;right:5%;bottom:2%;animation-direction:reverse;animation-duration:10s}.core{width:125px;height:125px;border:2px solid var(--lime);border-radius:50%;display:grid;place-content:center;text-align:center;background:#0b2c24;z-index:2;box-shadow:0 0 35px #d6f33125}.core b{font-size:47px;color:var(--lime)}.core span{font-size:9px;letter-spacing:.14em}.notice{padding:10px 13px;background:#42390d;border:1px solid #9c8525;border-radius:8px;color:#fff0a7;font-size:11px;margin-top:20px;display:inline-block}.how{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:25px 0}.how article{background:#12362d;border:1px solid var(--line);border-radius:12px;padding:18px}.how b{font-size:24px;color:var(--lime)}.how h3{margin:9px 0 5px}.how p{color:var(--muted);font-size:13px;line-height:1.5;margin:0}.hud{display:flex;justify-content:space-between;gap:12px;align-items:flex-end}.hud span{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em}.hud b{font-size:19px}.score{color:var(--lime);font-size:23px;font-weight:900}.progress{height:6px;background:#1a4035;border-radius:10px;overflow:hidden;margin:17px 0 25px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--lime));transition:width .35s}.mission{text-align:center}.difficulty{display:inline-block;padding:5px 10px;border:1px solid #5a8d7a;border-radius:100px;color:#b9e6d4;font-size:10px;text-transform:uppercase;letter-spacing:.12em}.mission h2{font-size:clamp(23px,4vw,36px);margin:14px auto 7px;max-width:760px}.mission>p{color:var(--muted);margin:0}.visual{height:190px;display:grid;place-items:center;margin:18px 0;background:radial-gradient(circle,#174b3a,#081f19 65%);border-radius:12px;overflow:hidden;position:relative}.visual:after{content:"";position:absolute;inset:0;background-image:linear-gradient(#fff06 1px,transparent 1px),linear-gradient(90deg,#fff06 1px,transparent 1px);background-size:28px 28px}.visual .emoji{font-size:clamp(62px,12vw,105px);z-index:1;filter:drop-shadow(0 0 18px #34d99b55)}.spinning{animation:spin 7s linear infinite}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.option{min-height:65px;text-align:left;border:1px solid #407162;border-radius:10px;background:#13382f;color:#fff;padding:12px;font-weight:750;display:flex;align-items:center;gap:10px}.option span{flex:0 0 31px;height:31px;border-radius:7px;background:#245345;color:var(--lime);display:grid;place-items:center}.option:hover,.option.selected{border-color:var(--lime);background:#274c39}.control{background:#091f19;border:1px solid #356354;border-radius:11px;padding:17px}.control label{display:flex;justify-content:space-between;font-weight:700}.control input[type=range]{width:100%;margin:18px 0 8px;accent-color:var(--lime)}.control small{color:var(--muted)}.pieces{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.piece{border:1px solid #548473;background:#153d32;color:#fff;border-radius:50%;width:76px;height:76px;font-weight:850}.piece small{display:block;font-size:9px}.piece.active{border-color:var(--lime);color:var(--lime)}.order{color:#cde2d9;margin-top:12px}.feedback{display:flex;gap:13px;align-items:center;text-align:left;border-radius:10px;padding:14px;margin-top:15px}.feedback.ok{background:#123f31;border:1px solid #2e8667}.feedback.no{background:#43390f;border:1px solid #867329}.feedback>b{font-size:24px}.feedback p{margin:0;line-height:1.45}.feedback strong{display:block}.game-actions{display:flex;gap:14px;align-items:center;margin-top:17px}.game-actions small{color:var(--muted)}.finish{text-align:center}.result{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:700px;margin:28px auto}.result article{background:#11342b;border:1px solid var(--line);border-radius:12px;padding:18px}.result span{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em}.result b{display:block;color:var(--lime);font-size:32px;margin-top:5px}.rank{width:100%;border-collapse:collapse;margin:20px 0}.rank th,.rank td{text-align:left;border-bottom:1px solid #31594e;padding:12px 8px}.rank th{color:var(--lime);font-size:11px;letter-spacing:.1em}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}.error{color:#ffb4a7;background:#4b201b;padding:9px 12px;border-radius:7px}.hide{display:none!important}footer{color:#709487;text-align:center;font-size:10px;padding:10px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:700px){.hero{grid-template-columns:1fr}.machine{display:none}.options,.how{grid-template-columns:1fr}.panel{margin:18px 0;padding:20px 15px}.brand div:last-child{font-size:13px}.brand small{display:none}.stats div{padding:0 14px}.result{grid-template-columns:1fr}.game-actions{flex-direction:column;align-items:stretch}.game-actions small{text-align:center}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top"><div class="brand"><div class="mark">⚙</div><div>DESAFÍO MECÁNICO<small>INGENIERÍA MECÁNICA · INCCA</small></div></div><div class="top-actions"><button class="icon" id="sound" aria-label="Silenciar">🔊</button><button class="icon" id="rankTop" aria-label="Ver ranking">🏆</button></div></header>
    <main id="app" class="panel" aria-live="polite"></main>
    <footer>Universidad INCCA de Colombia · Experiencia educativa para Corferias 2026</footer>
  </div>
  <script>
  'use strict';
  const app=document.getElementById('app'),KEY='incca-ranking-html-v1';
  const levels=[
    {t:'Reconoce las herramientas',d:'Fácil',q:'Debes ajustar una tuerca hexagonal sin dañarla.',i:'Selecciona la herramienta correcta.',type:'choice',o:['Llave combinada','Martillo','Segueta','Lima'],a:'Llave combinada',why:'La llave combinada abraza las caras de la tuerca y permite aplicar torque de forma controlada.',v:'🔧　🔩'},
    {t:'Engranajes en movimiento',d:'Fácil',q:'El engranaje A gira en sentido horario.',i:'¿En qué sentido gira B si está engranado directamente con A?',type:'choice',o:['Horario','Antihorario','Se detiene'],a:'Antihorario',why:'Dos engranajes externos en contacto giran en sentidos opuestos.',v:'⚙️　⚙️',spin:true},
    {t:'El poder de las palancas',d:'Fácil',q:'Necesitas levantar una carga con el menor esfuerzo.',i:'Ajusta la posición del punto de apoyo.',type:'range',min:20,max:80,step:10,start:50,unit:'%',a:'20',why:'Acercar el apoyo a la carga aumenta el brazo de esfuerzo y la ventaja mecánica.',v:'📦 ━━ 🔺 ━━━━━ ↓'},
    {t:'Fuerzas en movimiento',d:'Intermedia',q:'El vehículo avanza a velocidad constante en una vía horizontal.',i:'Selecciona la situación correcta.',type:'choice',o:['Fuerzas equilibradas','Fuerza mayor hacia adelante','Solo actúa el peso'],a:'Fuerzas equilibradas',why:'Velocidad constante implica aceleración cero; por tanto, la fuerza neta es cero.',v:'←　🚗　→'},
    {t:'Desafío de poleas',d:'Intermedia',q:'La carga pesa 120 N y los sistemas son ideales.',i:'Elige el montaje que requiere menos fuerza.',type:'choice',o:['Polea fija: 120 N','Polea móvil: 60 N','Aparejo de 4 tramos: 30 N'],a:'Aparejo de 4 tramos: 30 N',why:'Cuatro tramos sostienen la carga: 120 N ÷ 4 = 30 N.',v:'🪝　📦'},
    {t:'Controla la transmisión',d:'Intermedia',q:'El engranaje del motor tiene 12 dientes.',i:'Ajusta la salida para triplicar el torque ideal.',type:'range',min:12,max:48,step:12,start:12,unit:' dientes',a:'36',why:'La relación 36/12 = 3 triplica el torque ideal y reduce la velocidad a un tercio.',v:'⚙️　⚙️',spin:true},
    {t:'Ingeniería hidráulica',d:'Intermedia',q:'Aplicas 40 N en 2 cm²; la salida tiene 10 cm².',i:'Ajusta la fuerza de salida según el principio de Pascal.',type:'range',min:40,max:280,step:40,start:40,unit:' N',a:'200',why:'F₂ = F₁ × A₂/A₁ = 40 × 10/2 = 200 N.',v:'↓　▣ 💧 ▰　↑'},
    {t:'Eficiencia energética',d:'Avanzada',q:'La máquina recibe 500 W de potencia.',i:'Ajusta la potencia útil para obtener 80 % de eficiencia.',type:'range',min:100,max:500,step:50,start:100,unit:' W',a:'400',why:'Eficiencia = 400/500 = 0,80, es decir, 80 %.',v:'⚡　🏭　✨'},
    {t:'Diseña una transmisión',d:'Avanzada',q:'Motor: 1200 rpm. Objetivo: 400 rpm.',i:'Toca primero el engranaje conductor y después el conducido.',type:'sequence',parts:['12','24','36','48'],a:'12→36',why:'n₂ = 1200 × 12/36 = 400 rpm.',v:'⚙️　➡️　⚙️',spin:true},
    {t:'¡Salva la máquina!',d:'Final',q:'El motor gira, pero la banda patina y el transportador no se mueve.',i:'Elige la primera acción segura y correcta.',type:'choice',o:['Aumentar la velocidad','Tocar la banda para guiarla','Desconectar y bloquear; revisar tensión, desgaste y alineación'],a:'Desconectar y bloquear; revisar tensión, desgaste y alineación',why:'Antes de intervenir se debe aislar y bloquear la energía; luego se revisa tensión, desgaste y alineación.',v:'⚙️　⚠️　🔧'}
  ];
  let state={screen:'home',alias:'',idx:0,score:0,answer:'',submitted:false,records:[],started:0,levelStarted:0,seconds:0},sound=true;
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function ranks(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}
  function saveRank(row){const a=[...ranks(),row].sort((x,y)=>y.score-x.score||x.seconds-y.seconds||x.date.localeCompare(y.date)).slice(0,50);localStorage.setItem(KEY,JSON.stringify(a));return a.findIndex(x=>x===row)+1}
  function beep(ok){if(!sound)return;try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?680:230;g.gain.setValueAtTime(.05,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.16);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.16)}catch{}}
  function render(){if(state.screen==='home')home();if(state.screen==='instructions')instructions();if(state.screen==='game')game();if(state.screen==='finish')finish();if(state.screen==='ranking')ranking()}
  function home(){app.innerHTML=`<section class="hero"><div><p class="eyebrow">Corferias 2026 · experiencia interactiva</p><h1>¿Tienes mente de <span>ingeniero?</span></h1><p class="lead">Resuelve diez retos de mecanismos, fuerzas y energía. No necesitas instalar nada ni crear una cuenta.</p><div class="stats"><div><b>10</b>desafíos</div><div><b>4–6</b>minutos</div><div><b>100 %</b>en navegador</div></div><label class="field">Elige un alias<input id="alias" maxlength="20" autocomplete="off" placeholder="Ej. TorqueMaster" value="${esc(state.alias)}"><small>No escribas teléfono, correo ni otros datos personales.</small></label><p id="error" class="error hide"></p><div class="actions"><button class="btn" id="start">¡Comenzar desafío! →</button><button class="btn secondary" id="how">Cómo jugar</button></div><div class="notice">MODO LOCAL · El ranking se guarda únicamente en este dispositivo.</div></div><div class="machine" aria-hidden="true"><div class="gear">⚙</div><div class="gear two">⚙</div><div class="core"><b>10</b><span>NIVELES</span></div></div></section>`;document.getElementById('start').onclick=start;document.getElementById('how').onclick=()=>{state.screen='instructions';render()};document.getElementById('alias').onkeydown=e=>{if(e.key==='Enter')start()}}
  function instructions(){app.innerHTML=`<p class="eyebrow">Instrucciones</p><h1>Cómo funciona</h1><div class="how"><article><b>01</b><h3>Observa</h3><p>Lee el problema y explora el mecanismo.</p></article><article><b>02</b><h3>Resuelve</h3><p>Toca, selecciona o desliza el control.</p></article><article><b>03</b><h3>Aprende</h3><p>Recibirás una explicación y podrás avanzar aunque falles.</p></article></div><p class="lead">Las respuestas correctas suman puntos. La velocidad ofrece una bonificación pequeña, pero comprender importa más. Nunca hay puntajes negativos.</p><button class="btn" id="back">Volver al inicio</button>`;document.getElementById('back').onclick=()=>{state.screen='home';render()}}
  function start(){const input=document.getElementById('alias'),v=input.value.replace(/[<>]/g,'').replace(/\s+/g,' ').trim().slice(0,20);if(v.length<2){const e=document.getElementById('error');e.textContent='Escribe un alias de 2 a 20 caracteres.';e.classList.remove('hide');return}state={screen:'game',alias:v,idx:0,score:0,answer:'',submitted:false,records:[],started:Date.now(),levelStarted:Date.now(),seconds:0};render()}
  function interaction(l){if(l.type==='choice')return `<div class="options">${l.o.map((o,i)=>`<button class="option ${state.answer===o?'selected':''}" data-answer="${esc(o)}" ${state.submitted?'disabled':''}><span>${String.fromCharCode(65+i)}</span>${esc(o)}</button>`).join('')}</div>`;if(l.type==='range'){if(!state.answer)state.answer=String(l.start);return `<div class="control"><label>${esc(l.i)}<b id="rangeValue">${state.answer}${esc(l.unit)}</b></label><input id="range" type="range" min="${l.min}" max="${l.max}" step="${l.step}" value="${state.answer}" ${state.submitted?'disabled':''}><small>Desliza el control y observa el valor.</small></div>`}if(l.type==='sequence'){const chosen=state.answer?state.answer.split('→'):[];return `<div class="control"><div class="pieces">${l.parts.map(x=>`<button class="piece ${chosen.includes(x)?'active':''}" data-part="${x}" ${state.submitted||chosen.length===2?'disabled':''}>${x}<small>dientes</small></button>`).join('')}</div><div class="order">Tu selección: <b>${chosen.join(' → ')||'—'}</b></div><button class="btn secondary" id="reset" ${state.submitted||!state.answer?'disabled':''}>Reiniciar</button></div>`}}
  function game(){const l=levels[state.idx];app.innerHTML=`<div class="hud"><div><span>Nivel ${state.idx+1} de 10</span><b>${esc(l.t)}</b></div><div class="score">★ ${state.score}</div></div><div class="progress"><i style="width:${(state.idx+1)*10}%"></i></div><section class="mission"><span class="difficulty">${esc(l.d)}</span><h2>${esc(l.q)}</h2><p>${esc(l.i)}</p><div class="visual"><div class="emoji ${l.spin?'spinning':''}">${l.v}</div></div><div id="interaction">${interaction(l)}</div><div id="feedback"></div><div class="game-actions"><button id="check" class="btn" ${state.answer?'':'disabled'}>Comprobar respuesta</button><button id="next" class="btn hide">${state.idx===9?'Ver resultado final':'Siguiente nivel →'}</button><small>Los errores no restan puntos</small></div></section>`;bind(l)}
  function bind(l){document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(state.submitted)return;state.answer=b.dataset.answer;game()});const range=document.getElementById('range');if(range)range.oninput=e=>{state.answer=e.target.value;document.getElementById('rangeValue').textContent=state.answer+l.unit;document.getElementById('check').disabled=false};document.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{const parts=state.answer?state.answer.split('→'):[];if(parts.length<2){state.answer=[...parts,b.dataset.part].join('→');game()}});const reset=document.getElementById('reset');if(reset)reset.onclick=()=>{state.answer='';game()};document.getElementById('check').onclick=check;document.getElementById('next').onclick=next}
  function check(){if(state.submitted||!state.answer)return;const l=levels[state.idx],ok=state.answer===l.a,elapsed=Math.max(1,Math.floor((Date.now()-state.levelStarted)/1000)),bases=[100,100,100,140,140,140,140,190,190,250],bonus=ok?Math.max(0,30-Math.floor(elapsed/3)):0,points=ok?bases[state.idx]+bonus:0;state.score+=points;state.submitted=true;state.records.push({level:state.idx+1,answer:state.answer,correct:ok});document.getElementById('feedback').innerHTML=`<div class="feedback ${ok?'ok':'no'}"><b>${ok?'✓':'!'}</b><p><strong>${ok?'¡Correcto! +'+points+' puntos':'Buen intento. Sigue adelante.'}</strong>${esc(l.why)}</p></div>`;document.getElementById('check').classList.add('hide');document.getElementById('next').classList.remove('hide');document.querySelector('.score').textContent='★ '+state.score;document.querySelectorAll('#interaction button,#interaction input').forEach(x=>x.disabled=true);beep(ok)}
  function next(){if(!state.submitted)return;if(state.idx<9){state.idx++;state.answer='';state.submitted=false;state.levelStarted=Date.now();game();return}state.seconds=Math.max(1,Math.floor((Date.now()-state.started)/1000));state.position=saveRank({alias:state.alias,score:state.score,seconds:state.seconds,date:new Date().toISOString()});state.screen='finish';render()}
  function finish(){app.innerHTML=`<section class="finish"><div style="font-size:70px;color:var(--lime)">⚙</div><p class="eyebrow">Misión completada</p><h1>¡Tu ingenio puede <span>transformar el mundo!</span></h1><p class="lead" style="margin:auto">En Ingeniería Mecánica de la Universidad INCCA de Colombia puedes desarrollar habilidades para diseñar, analizar y mejorar máquinas, sistemas mecánicos y procesos tecnológicos.</p><div class="result"><article><span>Puntaje</span><b>${state.score}</b></article><article><span>Tiempo</span><b>${Math.floor(state.seconds/60)}:${String(state.seconds%60).padStart(2,'0')}</b></article><article><span>Posición local</span><b>#${state.position}</b></article></div><div class="actions" style="justify-content:center"><button class="btn" id="viewRank">Ver clasificación</button><button class="btn secondary" id="again">Volver a jugar</button></div></section>`;document.getElementById('viewRank').onclick=()=>{state.screen='ranking';render()};document.getElementById('again').onclick=()=>{state.screen='home';state.alias='';render()}}
  function ranking(){const a=ranks();app.innerHTML=`<p class="eyebrow">Clasificación del dispositivo</p><h1>🏆 Ranking local</h1><p class="lead">Estos resultados solo existen en este navegador. Se ordenan por puntaje, menor tiempo y fecha.</p>${a.length?`<table class="rank"><thead><tr><th>#</th><th>Alias</th><th>Puntos</th><th>Tiempo</th></tr></thead><tbody>${a.slice(0,10).map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.alias)}</td><td>${r.score}</td><td>${r.seconds}s</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Todavía no hay participantes en este dispositivo.</div>'}<button class="btn secondary" id="home">Volver al inicio</button>`;document.getElementById('home').onclick=()=>{state.screen='home';render()}}
  document.getElementById('sound').onclick=()=>{sound=!sound;document.getElementById('sound').textContent=sound?'🔊':'🔇';document.getElementById('sound').setAttribute('aria-label',sound?'Silenciar':'Activar sonido')};document.getElementById('rankTop').onclick=()=>{state.screen='ranking';render()};render();
  </script>
</body>
</html>
